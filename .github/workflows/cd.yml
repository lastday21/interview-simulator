name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to local Docker server
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Write production environment
        shell: powershell
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          PRODUCTION_ENV_FILE: "F:\\actions-runner\\secrets\\interview-simulator.env"
        run: |
          $envPath = Join-Path $PWD ".env"
          if (-not [string]::IsNullOrWhiteSpace($env:PRODUCTION_ENV)) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($envPath, $env:PRODUCTION_ENV, $utf8NoBom)
          }
          elseif (Test-Path $env:PRODUCTION_ENV_FILE) {
            Copy-Item -LiteralPath $env:PRODUCTION_ENV_FILE -Destination $envPath -Force
          }
          else {
            throw "Missing production environment: set GitHub secret PRODUCTION_ENV or create $env:PRODUCTION_ENV_FILE"
          }

      - name: Deploy
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectPath "$PWD"
