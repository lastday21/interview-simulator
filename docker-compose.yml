services:
  db:
    image: postgres:16-alpine
    container_name: interview-simulator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
